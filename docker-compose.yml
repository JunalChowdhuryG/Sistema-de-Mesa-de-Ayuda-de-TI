services:
  it-help-desk-db:
    image: mysql:8.0
    container_name: it-help-desk-db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=helpdesk
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  it-help-desk-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: it-help-desk-app
    restart: on-failure
    depends_on:
      - it-help-desk-db
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://it-help-desk-db:3306/helpdesk?useSSL=false&allowPublicKeyRetrieval=true
      - SPRING_DATASOURCE_USERNAME=root
      - SPRING_DATASOURCE_PASSWORD=root
      - SPRING_JPA_HIBERNATE_DDL_AUTO=validate

volumes:
  db_data: